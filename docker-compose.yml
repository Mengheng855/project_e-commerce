services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_DEV_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tostinh
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: tostinh
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
