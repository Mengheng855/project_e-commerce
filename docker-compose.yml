services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tostinh
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: tostinh
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - database

volumes:
  database_data:
  grafana_data:
