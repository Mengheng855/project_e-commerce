name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: tos_tinh
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd /var/www/tos_tinh/project_e-commerce

            echo "🔄 Updating code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Installing Composer dependencies..."
            docker compose run --rm backend composer install

            echo "🐳 Building and starting containers..."
            docker compose up -d --build

            echo "🗄️ Running migrations..."
            docker compose exec -T backend php artisan migrate --force

            echo "🔄 Restarting backend..."
            docker compose restart backend

            echo "✅ Deployment completed!"

      - name: Telegram - Deployment Success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ TosTinh deployment successful%0A%0ABranch: main%0ACommit: ${{ github.sha }}%0ARepository: ${{ github.repository }}"

      - name: Telegram - Deployment Failed
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=❌ TosTinh deployment FAILED%0A%0ABranch: main%0ACommit: ${{ github.sha }}%0ARepository: ${{ github.repository }}%0ACheck GitHub Actions for details."
