name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/myapp/project_e-commerce

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            docker compose run --rm backend composer install
            docker compose up -d --build
            docker compose exec backend php artisan migrate --force
            docker compose restart backend

      - name: Telegram - Deployment Success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ TosTinh deployment successful%0A%0ABranch: main%0ACommit: ${{ github.sha }}%0ARepository: ${{ github.repository }}"

      - name: Telegram - Deployment Failed
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=❌ TosTinh deployment FAILED%0A%0ABranch: main%0ACommit: ${{ github.sha }}%0ARepository: ${{ github.repository }}%0ACheck GitHub Actions for details."